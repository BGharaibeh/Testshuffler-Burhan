<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Shuffler</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef } = React;




// ---------- parsing ----------
const CHOICE_RE = /^\s*\*?\s*\(?\s*([A-Ha-h])\s*[).:\-]\s*(.*)$/;
const ANSWER_RE = /^\s*(?:correct answer|answer|ans|correct|key)\s*[:.\-)]?\s*([A-Ha-h])\b/i;
const QNUM_RE = /^\s*\d+\s*[).:\-]\s*/;

// WordprocessingML namespace
const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";

// --- read the .docx as a zip and pull bold straight from the XML ---
// This is what makes bold reliable: it sees bold whether it's applied
// directly (Ctrl+B) or inherited from a Word paragraph/character style,
// which HTML converters silently drop.

async function inflateRaw(u8) {
  const stream = new Response(u8).body.pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function readZipEntries(bytes, names) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const u16 = (o) => dv.getUint16(o, true);
  const u32 = (o) => dv.getUint32(o, true);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--) {
    if (u32(i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a zip/.docx file");
  const count = u16(eocd + 10);
  let p = u32(eocd + 16);
  const want = new Set(names);
  const out = {};
  for (let n = 0; n < count && want.size > Object.keys(out).length; n++) {
    if (u32(p) !== 0x02014b50) break;
    const method = u16(p + 10);
    const compSize = u32(p + 20);
    const nameLen = u16(p + 28);
    const extraLen = u16(p + 30);
    const commentLen = u16(p + 32);
    const localOff = u32(p + 42);
    const name = new TextDecoder().decode(bytes.slice(p + 46, p + 46 + nameLen));
    if (want.has(name)) out[name] = { method, compSize, localOff };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

async function extractXml(bytes, entry) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const u16 = (o) => dv.getUint16(o, true);
  const u32 = (o) => dv.getUint32(o, true);
  if (u32(entry.localOff) !== 0x04034b50) throw new Error("bad local header");
  const nameLen = u16(entry.localOff + 26);
  const extraLen = u16(entry.localOff + 28);
  const start = entry.localOff + 30 + nameLen + extraLen;
  const data = bytes.slice(start, start + entry.compSize);
  const raw = entry.method === 0 ? data : await inflateRaw(data);
  return new TextDecoder("utf-8").decode(raw);
}

function childByName(el, name) {
  if (!el) return undefined;
  return Array.from(el.children).find((c) => c.localName === name && c.namespaceURI === W);
}

function boldFromRpr(rpr) {
  const b = childByName(rpr, "b");
  if (!b) return undefined;
  const v = b.getAttributeNS(W, "val");
  if (v == null) return true;
  return !["0", "false", "off", "none"].includes(v.toLowerCase());
}

function buildStyleMap(stylesXml) {
  const map = {};
  if (!stylesXml) return map;
  const doc = new DOMParser().parseFromString(stylesXml, "application/xml");
  for (const s of Array.from(doc.getElementsByTagNameNS(W, "style"))) {
    const id = s.getAttributeNS(W, "styleId");
    if (!id) continue;
    const basedOn = childByName(s, "basedOn");
    map[id] = {
      bold: boldFromRpr(childByName(s, "rPr")),
      basedOn: basedOn ? basedOn.getAttributeNS(W, "val") : null,
    };
  }
  return map;
}

function resolveStyleBold(id, map) {
  let cur = id, depth = 0;
  while (cur && map[cur] && depth < 25) {
    if (map[cur].bold !== undefined) return map[cur].bold;
    cur = map[cur].basedOn;
    depth++;
  }
  return undefined;
}

function readDocParagraphs(docXml, styleMap) {
  const doc = new DOMParser().parseFromString(docXml, "application/xml");
  const out = [];
  for (const p of Array.from(doc.getElementsByTagNameNS(W, "p"))) {
    const pPr = childByName(p, "pPr");
    const pStyleEl = childByName(pPr, "pStyle");
    const pStyleId = pStyleEl ? pStyleEl.getAttributeNS(W, "val") : null;

    let text = "";
    let bold = false;
    for (const r of Array.from(p.getElementsByTagNameNS(W, "r"))) {
      let rtext = "";
      for (const t of Array.from(r.getElementsByTagNameNS(W, "t"))) rtext += t.textContent || "";
      if (!rtext) continue;
      text += rtext;

      const rPr = childByName(r, "rPr");
      let rb = boldFromRpr(rPr); // direct formatting wins
      if (rb === undefined) {
        const rStyleEl = childByName(rPr, "rStyle"); // then character style
        const rStyleId = rStyleEl ? rStyleEl.getAttributeNS(W, "val") : null;
        if (rStyleId) rb = resolveStyleBold(rStyleId, styleMap);
      }
      if (rb === undefined && pStyleId) rb = resolveStyleBold(pStyleId, styleMap); // then paragraph style
      if (rb === true && rtext.trim()) bold = true;
    }
    const clean = text.replace(/\s+/g, " ").trim();
    if (clean) out.push({ text: clean, bold, isLi: false });
  }
  return out;
}

async function readDocxParagraphs(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const entries = readZipEntries(bytes, ["word/document.xml", "word/styles.xml"]);
  if (!entries["word/document.xml"]) throw new Error("no document.xml");
  const docXml = await extractXml(bytes, entries["word/document.xml"]);
  const stylesXml = entries["word/styles.xml"] ? await extractXml(bytes, entries["word/styles.xml"]) : "";
  return readDocParagraphs(docXml, buildStyleMap(stylesXml));
}

// Fallback reader (used only if the direct XML read fails in a given browser)
function htmlToParagraphs(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  return Array.from(doc.body.querySelectorAll("p, li"))
    .map((el) => ({
      text: (el.textContent || "").replace(/\s+/g, " ").trim(),
      bold: !!el.querySelector(
        'strong, b, [style*="font-weight:bold"], [style*="font-weight: bold"], [style*="font-weight:700"], [style*="font-weight: 700"]'
      ),
      isLi: el.tagName.toLowerCase() === "li",
    }))
    .filter((x) => x.text);
}

// Turn a flat list of {text, bold, isLi} paragraphs into questions.
function parseParagraphs(paras) {
  const questions = [];
  let cur = null;

  const pushCur = () => {
    if (cur && cur.choices.length) questions.push(cur);
    cur = null;
  };

  for (const node of paras) {
    const text = node.text;
    if (!text) continue;
    const bold = node.bold;
    const isLi = node.isLi;

    const choiceMatch = text.match(CHOICE_RE);
    const ansMatch = text.match(ANSWER_RE);

    // "Answer: B" line (only if it isn't itself a real choice with content)
    if (ansMatch && (!choiceMatch || choiceMatch[2].trim() === "")) {
      if (cur) cur.answerLetter = ansMatch[1].toUpperCase();
      continue;
    }

    const asChoiceByLi = isLi && cur && cur.stem && !choiceMatch;
    if (choiceMatch || asChoiceByLi) {
      if (!cur) cur = { stem: "", choices: [], answerLetter: null };
      const star = /^\s*\*/.test(text) || /\*\s*$/.test(text);
      const raw = choiceMatch ? choiceMatch[2] : text;
      const clean = raw.replace(/^\*\s*/, "").replace(/\s*\*\s*$/, "").trim();
      cur.choices.push({ text: clean, bold, star });
      continue;
    }

    // otherwise it's a stem / new question
    if (cur && cur.choices.length) pushCur();
    if (!cur) cur = { stem: text.replace(QNUM_RE, ""), choices: [], answerLetter: null };
    else cur.stem = (cur.stem ? cur.stem + " " : "") + text.replace(QNUM_RE, "");
  }
  pushCur();

  return questions.map((q, i) => ({
    id: i,
    stem: q.stem,
    choices: q.choices,
    answerLetter: q.answerLetter,
    include: true,
  }));
}

function detectCorrect(q, mode) {
  let idx = -1;
  if (mode === "bold" || mode === "auto") idx = q.choices.findIndex((c) => c.bold);
  if (idx < 0 && (mode === "asterisk" || mode === "auto")) idx = q.choices.findIndex((c) => c.star);
  if (idx < 0 && (mode === "answerline" || mode === "auto") && q.answerLetter) {
    const target = q.answerLetter.charCodeAt(0) - 65;
    if (target >= 0 && target < q.choices.length) idx = target;
  }
  return idx;
}

// ---------- utils ----------
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const LETTERS = "ABCDEFGH";
const vLabel = (i) => LETTERS[i] || `V${i + 1}`;

// ---------- app ----------
function App() {
  const [stage, setStage] = useState("upload"); // upload | review | output
  const [fileName, setFileName] = useState("");
  const [questions, setQuestions] = useState([]);
  const [correct, setCorrect] = useState({}); // id -> index (or -1)
  const [rawText, setRawText] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const [mode, setMode] = useState("auto");
  const [shuffleQ, setShuffleQ] = useState(true);
  const [shuffleC, setShuffleC] = useState(true);
  const [numVersions, setNumVersions] = useState(2);
  const [title, setTitle] = useState("Test");

  const [versions, setVersions] = useState([]);
  const fileRef = useRef(null);

  async function handleFile(file) {
    if (!file) return;
    setBusy(true);
    setError("");
    try {
      const buf = await file.arrayBuffer();
      let paras;
      try {
        // Primary: read bold directly from the document XML (catches style-based bold).
        paras = await readDocxParagraphs(buf);
      } catch (e) {
        // Fallback for any browser without DecompressionStream: use mammoth's HTML.
        if (typeof mammoth === "undefined") throw e;
        const { value: html } = await mammoth.convertToHtml({ arrayBuffer: buf });
        paras = htmlToParagraphs(html);
      }
      const qs = parseParagraphs(paras);
      setRawText(paras.map((p) => p.text).join("\n"));
      setFileName(file.name);
      if (!qs.length) {
        setError(
          "Couldn't find any multiple-choice questions in that file. Check the raw text below to see what was read, then confirm your formatting."
        );
        setQuestions([]);
        setStage("upload");
      } else {
        const c = {};
        qs.forEach((q) => (c[q.id] = detectCorrect(q, mode)));
        setQuestions(qs);
        setCorrect(c);
        setStage("review");
      }
    } catch (e) {
      setError("That file couldn't be read. It needs to be a .docx (not the older .doc) file.");
    } finally {
      setBusy(false);
    }
  }

  // recompute detection when marking mode changes
  function applyMode(newMode) {
    setMode(newMode);
    const c = {};
    questions.forEach((q) => (c[q.id] = detectCorrect(q, newMode)));
    setCorrect(c);
  }

  const included = questions.filter((q) => q.include);
  const undetected = included.filter((q) => (correct[q.id] ?? -1) < 0).length;

  function generate() {
    const base = questions.filter((q) => q.include);
    const out = [];
    for (let v = 0; v < numVersions; v++) {
      const order = shuffleQ ? shuffled(base) : base;
      const items = order.map((q) => {
        const ci = correct[q.id] ?? -1;
        const tagged = q.choices.map((c, idx) => ({ ...c, wasCorrect: idx === ci }));
        const arranged = shuffleC ? shuffled(tagged) : tagged;
        const newCorrect = arranged.findIndex((c) => c.wasCorrect);
        return { stem: q.stem, choices: arranged, correct: newCorrect };
      });
      out.push(items);
    }
    setVersions(out);
    setStage("output");
  }

  function reset() {
    setStage("upload");
    setQuestions([]);
    setVersions([]);
    setCorrect({});
    setFileName("");
    setError("");
    setRawText("");
    if (fileRef.current) fileRef.current.value = "";
  }

  return (
    <div className="min-h-screen bg-slate-100 text-slate-900" style={{ fontFamily: "'Inter', system-ui, sans-serif" }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          body, .app-bg { background: white !important; }
          @page { margin: 0.65in; }
          .version-sheet { break-before: page; }
          .version-sheet:first-child { break-before: auto; }
          .keep { break-inside: avoid; }
        }
        .print-only { display: none; }
        .exam { font-family: Georgia, 'Times New Roman', serif; }
      `}</style>

      <div className="app-bg">
        {/* header */}
        <header className="no-print border-b border-slate-200 bg-white">
          <div className="mx-auto max-w-4xl px-6 py-4 flex items-center justify-between">
            <div>
              <h1 className="text-lg font-semibold tracking-tight">Test shuffler</h1>
              <p className="text-sm text-slate-500">Upload a Word file, shuffle questions and choices, print versions with answer keys.</p>
            </div>
            {stage !== "upload" && (
              <button onClick={reset} className="text-sm text-slate-500 hover:text-slate-900">
                Start over
              </button>
            )}
          </div>
        </header>

        <main className="mx-auto max-w-4xl px-6 py-8">
          {/* UPLOAD */}
          {stage === "upload" && (
            <div className="no-print">
              <label
                htmlFor="file"
                className="block cursor-pointer rounded-xl border-2 border-dashed border-slate-300 bg-white px-8 py-14 text-center transition hover:border-indigo-400 hover:bg-indigo-50/40"
              >
                <div className="text-slate-700 font-medium">
                  {busy ? "Reading your file…" : "Choose a Word (.docx) file"}
                </div>
                <div className="mt-1 text-sm text-slate-500">or drag it onto this box</div>
                <input
                  id="file"
                  ref={fileRef}
                  type="file"
                  accept=".docx"
                  className="hidden"
                  onChange={(e) => handleFile(e.target.files?.[0])}
                />
              </label>
              <div
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => {
                  e.preventDefault();
                  handleFile(e.dataTransfer.files?.[0]);
                }}
                className="mt-2 text-xs text-slate-400 text-center"
              >
                Nothing you upload leaves your browser.
              </div>

              {error && (
                <div className="mt-6 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
                  {error}
                </div>
              )}

              {rawText && (
                <details className="mt-4 rounded-lg border border-slate-200 bg-white p-4">
                  <summary className="cursor-pointer text-sm font-medium text-slate-600">Raw text that was read</summary>
                  <pre className="mt-3 max-h-64 overflow-auto whitespace-pre-wrap text-xs text-slate-600">{rawText}</pre>
                </details>
              )}

              <div className="mt-8 rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-600">
                <p className="font-medium text-slate-800">How to format your questions</p>
                <p className="mt-2">Number each question, then list choices labeled A, B, C… Mark the correct answer any one of these ways:</p>
                <ul className="mt-2 space-y-1 list-disc pl-5">
                  <li><span className="font-medium">Bold</span> the correct choice</li>
                  <li>Put an asterisk on it, e.g. <code className="text-indigo-700">*B) Paris</code></li>
                  <li>Add a line after the choices: <code className="text-indigo-700">Answer: B</code></li>
                </ul>
                <p className="mt-2">Whatever it reads, you can fix any answer by hand on the next screen.</p>
              </div>
            </div>
          )}

          {/* REVIEW */}
          {stage === "review" && (
            <div className="no-print">
              <div className="rounded-lg border border-slate-200 bg-white p-5">
                <div className="flex flex-wrap items-center gap-4">
                  <div className="text-sm text-slate-600">
                    <span className="font-medium text-slate-900">{included.length}</span> questions from{" "}
                    <span className="font-medium">{fileName}</span>
                  </div>
                  {undetected > 0 && (
                    <div className="rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-800">
                      {undetected} without a marked answer
                    </div>
                  )}
                  <div className="ml-auto flex items-center gap-2 text-sm">
                    <span className="text-slate-500">Answers marked by:</span>
                    <select
                      value={mode}
                      onChange={(e) => applyMode(e.target.value)}
                      className="rounded-md border border-slate-300 px-2 py-1 text-sm"
                    >
                      <option value="auto">Auto-detect</option>
                      <option value="bold">Bold choice</option>
                      <option value="asterisk">Asterisk</option>
                      <option value="answerline">"Answer:" line</option>
                    </select>
                  </div>
                </div>
              </div>

              <p className="mt-4 mb-2 text-sm text-slate-500">
                Check each correct answer (green). Click a different choice to change it, or uncheck a question to leave it out.
              </p>

              <ol className="space-y-3">
                {questions.map((q, qi) => {
                  const ci = correct[q.id] ?? -1;
                  return (
                    <li
                      key={q.id}
                      className={`rounded-lg border bg-white p-4 ${q.include ? "border-slate-200" : "border-slate-200 opacity-50"}`}
                    >
                      <div className="flex items-start gap-3">
                        <input
                          type="checkbox"
                          checked={q.include}
                          onChange={() =>
                            setQuestions((qs) => qs.map((x) => (x.id === q.id ? { ...x, include: !x.include } : x)))
                          }
                          className="mt-1"
                        />
                        <div className="flex-1">
                          <div className="font-medium text-slate-900">{qi + 1}. {q.stem}</div>
                          <div className="mt-2 space-y-1.5">
                            {q.choices.map((c, idx) => {
                              const isCorrect = idx === ci;
                              return (
                                <button
                                  key={idx}
                                  onClick={() => setCorrect((m) => ({ ...m, [q.id]: idx }))}
                                  className={`flex w-full items-center gap-2 rounded-md px-2 py-1 text-left text-sm transition ${
                                    isCorrect
                                      ? "bg-emerald-50 text-emerald-900 ring-1 ring-emerald-300"
                                      : "hover:bg-slate-50 text-slate-700"
                                  }`}
                                >
                                  <span
                                    className={`flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-xs font-semibold ${
                                      isCorrect ? "bg-emerald-600 text-white" : "bg-slate-200 text-slate-600"
                                    }`}
                                  >
                                    {LETTERS[idx]}
                                  </span>
                                  {c.text}
                                </button>
                              );
                            })}
                          </div>
                          {ci < 0 && (
                            <div className="mt-1 text-xs text-amber-700">No answer marked — click the correct one.</div>
                          )}
                        </div>
                      </div>
                    </li>
                  );
                })}
              </ol>

              <div className="sticky bottom-0 mt-6 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
                <div className="flex flex-wrap items-center gap-x-6 gap-y-3">
                  <label className="flex items-center gap-2 text-sm">
                    <span className="text-slate-500">Test title</span>
                    <input
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      className="w-40 rounded-md border border-slate-300 px-2 py-1 text-sm"
                    />
                  </label>
                  <label className="flex items-center gap-2 text-sm">
                    <span className="text-slate-500">Versions</span>
                    <input
                      type="number"
                      min={1}
                      max={8}
                      value={numVersions}
                      onChange={(e) => setNumVersions(Math.max(1, Math.min(8, Number(e.target.value) || 1)))}
                      className="w-16 rounded-md border border-slate-300 px-2 py-1 text-sm"
                    />
                  </label>
                  <label className="flex items-center gap-2 text-sm">
                    <input type="checkbox" checked={shuffleQ} onChange={() => setShuffleQ((v) => !v)} />
                    Shuffle question order
                  </label>
                  <label className="flex items-center gap-2 text-sm">
                    <input type="checkbox" checked={shuffleC} onChange={() => setShuffleC((v) => !v)} />
                    Shuffle choices
                  </label>
                  <button
                    onClick={generate}
                    disabled={included.length === 0}
                    className="ml-auto rounded-md bg-indigo-700 px-5 py-2 text-sm font-medium text-white hover:bg-indigo-800 disabled:opacity-40"
                  >
                    Generate {numVersions} version{numVersions > 1 ? "s" : ""}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* OUTPUT */}
          {stage === "output" && (
            <div>
              <div className="no-print mb-6 flex flex-wrap items-center gap-3">
                <button onClick={() => setStage("review")} className="text-sm text-slate-600 hover:text-slate-900">
                  ← Back to questions
                </button>
                <button
                  onClick={generate}
                  className="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50"
                >
                  Reshuffle
                </button>
                <button
                  onClick={() => window.print()}
                  className="ml-auto rounded-md bg-indigo-700 px-5 py-2 text-sm font-medium text-white hover:bg-indigo-800"
                >
                  Print / Save as PDF
                </button>
              </div>

              <div className="space-y-6">
                {versions.map((items, vi) => (
                  <div key={vi} className="version-sheet exam rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
                    <div className="mb-6 flex items-baseline justify-between border-b border-slate-300 pb-3">
                      <div className="text-xl font-bold">{title} — Version {vLabel(vi)}</div>
                      <div className="text-sm text-slate-600">Name: ______________________</div>
                    </div>
                    <ol className="space-y-5">
                      {items.map((it, qi) => (
                        <li key={qi} className="keep">
                          <div className="font-semibold">{qi + 1}. {it.stem}</div>
                          <div className="mt-1.5 space-y-1 pl-4">
                            {it.choices.map((c, idx) => (
                              <div key={idx}>
                                <span className="font-medium">{LETTERS[idx]}.</span> {c.text}
                              </div>
                            ))}
                          </div>
                        </li>
                      ))}
                    </ol>
                  </div>
                ))}

                {/* answer keys */}
                <div className="version-sheet exam rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
                  <div className="mb-4 text-xl font-bold border-b border-slate-300 pb-3">{title} — Answer keys</div>
                  <div className="grid grid-cols-1 gap-6 sm:grid-cols-2">
                    {versions.map((items, vi) => (
                      <div key={vi} className="keep">
                        <div className="mb-2 font-semibold">Version {vLabel(vi)}</div>
                        <div className="grid grid-cols-5 gap-y-1 text-sm">
                          {items.map((it, qi) => (
                            <div key={qi}>
                              {qi + 1}. <span className="font-bold">{it.correct >= 0 ? LETTERS[it.correct] : "—"}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
